plugins {
    id 'com.android.application'
}

android {
    namespace 'com.verbforge.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.verbforge.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}
