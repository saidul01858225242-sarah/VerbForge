name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 64-bit APK
        run: ./gradlew assembleDebug -PabiFilters=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VerbForge-64bit-arm64-v8a
          path: app/build/outputs/apk/debug/app-debug.apk
